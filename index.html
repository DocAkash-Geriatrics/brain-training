<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<meta name="description" content="Short brain training games in Hindi and English: speed, memory, focus, words and everyday tasks.">
<title>Brain Training Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
:root{
  --bg:#f6f1e7;--bg2:#efe7d6;--surface:#fffdf8;--fg:#1d2a2c;--muted:#56666a;--line:#ddd3bf;--track:#ebe3d2;
  --accent:#0f6e6a;--accent-fg:#fff;--accent-soft:#d9eeea;
  --good:#24673a;--good-bg:#def1e2;--bad:#a2342b;--bad-bg:#f9e1dc;--warn:#8a5600;--warn-bg:#fbedcf;
  --m1:#b8730a;--m1s:#fbecd2;--m2:#0f6e6a;--m2s:#d9eeea;--m3:#4b4db0;--m3s:#e3e3f7;--m4:#bf4e33;--m4s:#f9e2da;
  --m5:#2667ad;--m5s:#dde9f6;--m6:#3b7a33;--m6s:#e0efda;--m7:#87468a;--m7s:#f1e2f1;--m8:#8a5a12;--m8s:#f6e9d2;
  --s1:#2a78d6;--s2:#eb6834;
  --display:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111819;--bg2:#162022;--surface:#1a2427;--fg:#ecf2f1;--muted:#a3b6b8;--line:#2d3d40;--track:#253235;
  --accent:#5fc9c1;--accent-fg:#06221f;--accent-soft:#183a37;
  --good:#8bd69a;--good-bg:#1c3424;--bad:#f5a197;--bad-bg:#3f211d;--warn:#f1c062;--warn-bg:#3a2f15;
  --m1:#f0b44a;--m1s:#3a2c12;--m2:#5fc9c1;--m2s:#173836;--m3:#a3a5f2;--m3s:#26264a;--m4:#f3967e;--m4s:#3f231b;
  --m5:#7fb3ec;--m5s:#192d44;--m6:#93d38a;--m6s:#1d3319;--m7:#df9de1;--m7s:#36203a;--m8:#e6b25e;--m8s:#3a2b14;
  --s1:#3987e5;--s2:#d95926;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111819;--bg2:#162022;--surface:#1a2427;--fg:#ecf2f1;--muted:#a3b6b8;--line:#2d3d40;--track:#253235;
  --accent:#5fc9c1;--accent-fg:#06221f;--accent-soft:#183a37;
  --good:#8bd69a;--good-bg:#1c3424;--bad:#f5a197;--bad-bg:#3f211d;--warn:#f1c062;--warn-bg:#3a2f15;
  --m1:#f0b44a;--m1s:#3a2c12;--m2:#5fc9c1;--m2s:#173836;--m3:#a3a5f2;--m3s:#26264a;--m4:#f3967e;--m4s:#3f231b;
  --m5:#7fb3ec;--m5s:#192d44;--m6:#93d38a;--m6s:#1d3319;--m7:#df9de1;--m7s:#36203a;--m8:#e6b25e;--m8s:#3a2b14;
  --s1:#3987e5;--s2:#d95926;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:19px/1.55 var(--sans);padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5.4vw,44px)}h2{font-size:clamp(24px,3.6vw,30px)}h3{font-size:21px}
p{margin:0}
.muted{color:var(--muted);font-size:16px}
.eyebrow{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:700 18px var(--sans);min-height:54px;padding:10px 22px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;transition:transform .08s ease}
button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--accent)}
button.small{min-height:44px;font-size:16px;padding:6px 14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
input[type=text],input[type=email],input[type=tel],select{font:inherit;font-size:20px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
/* header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font:700 22px var(--display)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
/* hero */
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--bg2));border-radius:24px;padding:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center;box-shadow:var(--shadow)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .lead{font-size:19px;max-width:52ch}
.hero .art{width:100%;max-width:300px;justify-self:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.today{border-left:8px solid var(--accent)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.week span{display:grid;place-items:center;width:44px;height:52px;border-radius:12px;background:var(--bg2);font-size:13px;color:var(--muted);font-weight:700;line-height:1.1;text-align:center}
.week span.on{background:var(--accent);color:var(--accent-fg)}
.week span.now{outline:2px solid var(--accent);outline-offset:2px}
/* game grid */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.gcard .top{background:var(--gs);padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gcard .top svg{width:58px;height:58px;flex:none}
.gcard .tag{font:700 13px var(--sans);letter-spacing:.1em;color:var(--gc)}
.gcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard .body p{color:var(--muted);font-size:16px}
.gcard .modes{font-size:14px;color:var(--muted)}
.gcard button{margin-top:auto;align-self:flex-start;background:var(--gc);border-color:var(--gc);color:var(--surface)}
.gcard .done{font-size:14px;font-weight:700;color:var(--gc)}
/* game screens */
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:18px;padding:14px 18px;background:var(--gs)}
.gamehead h2{color:var(--fg)}
.gamehead .tag{font:700 13px var(--sans);letter-spacing:.1em;color:var(--gc)}
.modes-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.modecard{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;color:var(--fg);font:400 17px var(--sans);min-height:0}
.modecard b{font:700 19px var(--sans)}
.modecard:hover{border-color:var(--gc)}
.tips{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.msg{font-size:23px;text-align:center;min-height:34px;font-weight:700}
.fb{text-align:center;min-height:30px;font-weight:700;font-size:20px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.prog{height:10px;background:var(--track);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gc,var(--accent));width:0;transition:width .3s}
.tag2{font-size:15px;text-align:center;color:var(--muted)}
.big{font-size:28px;font-family:var(--display);text-align:center}
/* M1 */
.stage{position:relative;width:min(100%,460px);aspect-ratio:1;margin:0 auto;background:var(--surface);border:2px solid var(--line);border-radius:22px;touch-action:manipulation}
.slot{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:clamp(20px,6vw,34px);border-radius:50%;border:2px dashed var(--line);color:var(--fg);background:transparent;padding:0;min-height:0;font-weight:400}
.slot.live{cursor:pointer;border-color:var(--gc);border-style:solid}
.slot.pick{background:var(--gs)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:18%;aspect-ratio:1;font-size:clamp(26px,7vw,40px)}
.shape{width:62%;aspect-ratio:1;background:var(--fg)}.shape.circle{border-radius:50%}
/* grids */
.pair{font-size:28px;text-align:center;padding:20px;border-radius:18px;background:var(--gs)}
.pair b{display:block;font-family:var(--display);font-size:36px}
.gridn{display:grid;gap:8px;width:min(100%,400px);margin:0 auto}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(26px,8vw,48px);border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0;min-height:0;color:var(--fg);font-weight:400}
.cell.live{cursor:pointer;border-color:var(--gc)}
.cell.lit{background:var(--gc);border-color:var(--gc)}
.cell.sel{background:var(--gs);border-color:var(--gc)}
.cell.right{background:var(--good-bg);border-color:var(--good)}.cell.wrong{background:var(--bad-bg);border-color:var(--bad)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pick-grid button{background:var(--surface);color:var(--fg);border:2px solid var(--line);font-weight:400;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px}
.pick-grid button .e{font-size:34px;line-height:1.1}
.pick-grid button.sel{border-color:var(--gc);background:var(--gs);font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(100%,420px);margin:0 auto}
.keypad button{background:var(--surface);color:var(--fg);border:2px solid var(--line);font-size:24px;padding:6px}
.entry{font:700 34px var(--display);text-align:center;letter-spacing:.3em;min-height:46px}
.flashnum{font:700 clamp(70px,20vw,120px) var(--display);text-align:center;min-height:150px;color:var(--gc)}
/* M4 */
.deck{display:flex;justify-content:center}
.card{background:#fff;color:#111;border:3px solid #333;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;font-size:16px;font-weight:700}
.card svg{width:84px;height:84px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts .card{cursor:pointer;min-width:0;width:100%;font:700 16px var(--sans)}
.cue{text-align:center;font-size:24px;font-weight:700;padding:8px;border-radius:12px;background:var(--warn-bg);color:var(--warn);min-height:48px}
.nlbox{display:grid;grid-template-rows:1fr 1fr;width:min(100%,320px);margin:0 auto;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.nlbox div{min-height:110px;display:grid;place-items:center;font:700 54px var(--display);position:relative}
.nlbox div+div{border-top:3px dashed var(--line)}
.nlbox small{position:absolute;top:6px;left:10px;font:700 13px var(--sans);color:var(--muted);letter-spacing:.06em}
.stroop{font:700 clamp(48px,14vw,84px) var(--display);text-align:center;background:#fff;border-radius:18px;padding:18px;border:2px solid var(--line)}
.inkbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,460px);margin:0 auto}
.inkbtns button{background:var(--surface);color:var(--fg);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.inkbtns button i{width:22px;height:22px;border-radius:50%;display:inline-block}
/* M6, M7 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:4px 12px;border-radius:99px;background:var(--gs,var(--accent-soft));font-size:17px}
.chips span.un{background:var(--warn-bg);color:var(--warn)}
.chips span.dup{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.timer{font:700 36px var(--display);text-align:center}
.emoji{font-size:96px;text-align:center;line-height:1.1}
.sentence{font:600 26px var(--display);text-align:center;line-height:1.35}
.rowin{display:grid;grid-template-columns:1fr auto;gap:10px}
.anchors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.anchors label{display:flex;gap:14px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.anchors input{width:28px;height:28px;accent-color:var(--m7);flex:none}
.anchors label.on{border-color:var(--m7);background:var(--m7s)}
.lesson{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lesson.done{border-color:var(--m7)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--fg);border:2px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--m7);border-color:var(--m7);color:var(--surface)}
/* results, progress, admin */
.res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.res dt{color:var(--muted)}.res dd{margin:0;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:16px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tw{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .sub{font-size:15px;color:var(--muted)}
.ax{stroke:var(--line);stroke-width:1}.gl{stroke:var(--line);stroke-width:1;opacity:.7}
.tx{fill:var(--muted);font:13px var(--sans)}
.ln{fill:none;stroke:var(--s1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.bar1{fill:var(--s1)}.ref{stroke:var(--fg);stroke-width:2;stroke-dasharray:5 4;fill:none}
.chg{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 130px;gap:10px;align-items:center;font-size:16px}
@media (max-width:600px){.chg{grid-template-columns:minmax(0,1fr) 120px}.chg .trk{grid-column:1/-1;order:3}}
.trk{position:relative;height:22px;background:var(--track);border-radius:6px}
.trk i{position:absolute;top:0;bottom:0;border-radius:4px}
.trk i.up{background:var(--s1);left:50%}.trk i.dn{background:var(--s2);right:50%}
.trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .a::before{background:var(--s1)}.legend .b::before{background:var(--s2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:700 30px var(--display)}
.stat span{color:var(--muted);font-size:15px}
.err{color:var(--bad);font-size:16px;font-weight:700;min-height:0}
.foot{font-size:14px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}

.langpick{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.langrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.langbtn{display:flex;flex-direction:column;gap:6px;align-items:center;padding:26px 12px;border-radius:20px;background:var(--surface);color:var(--fg);border:3px solid var(--line);font:400 17px var(--sans)}
.langbtn b{font:700 34px var(--display)}
.langbtn:hover,.langbtn:focus-visible{border-color:var(--accent)}
.howtxt{font-size:23px;line-height:1.5;max-width:40ch}
.speak{align-self:flex-start}
.listen{text-align:center;font-weight:700;color:var(--gc);min-height:1.4em}
.tally{font-size:24px;padding:18px 34px}
.modecard.last{border-color:var(--gc)}
.homegrid .place{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;aspect-ratio:auto;min-height:92px;padding:6px}
.homegrid .place .e{font-size:clamp(26px,7vw,40px);min-height:1.2em}
.homegrid .place small{font-size:13px;color:var(--muted);text-align:center;line-height:1.2}
.slip{background:var(--gs);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.slip h3{margin:0}
.billrow{display:flex;justify-content:space-between;gap:12px;font-size:20px;margin:0}
.billrow.total{border-top:2px dashed var(--line);padding-top:6px;font-weight:700}
.rxcard{background:var(--gs);box-shadow:none}
.rxline{font-size:19px;margin:4px 0}
.pillbox{display:flex;flex-direction:column;gap:12px}
.pillrow{display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);border-radius:16px;padding:12px}
.pillrow.right{border-color:var(--good)}.pillrow.wrong{border-color:var(--bad)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slotbtn{background:var(--surface);color:var(--fg);border:2px solid var(--line);font-weight:600;flex:1 1 120px}
.slotbtn.sel{background:var(--gc);border-color:var(--gc);color:var(--surface)}
.wallet{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wallet .note{background:var(--gs);color:var(--fg);border:2px solid var(--gc);border-radius:8px;min-width:84px;font-weight:700}
.wallet .coin{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:50%;width:64px;height:64px;padding:0;font-weight:700}
.btnrow.col{flex-direction:column;align-items:stretch}
.btnrow.col button{text-align:left;white-space:normal}
.btnrow.col button.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.btnrow.col button.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.sortgrid .cell.sel{background:var(--gs);border-color:var(--gc)}
.week{flex-wrap:nowrap!important}.week span{flex:1 1 0;min-width:0}
.novoice{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:15px;max-width:560px;margin:0 auto}
:lang(hi) body{font-family:"Noto Sans Devanagari",var(--sans)}
/* ===== animated icons ===== */
.ai *{transform-box:fill-box;transform-origin:center}
.aib .b1{animation:breathe 4.5s ease-in-out infinite}.aib .b2{animation:breathe 4.5s ease-in-out -1.5s infinite}.aib .b3{animation:breathe 4.5s ease-in-out -3s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
.ai1 .ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(2.1);opacity:0}}
.ai1 .star{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(36deg)}}
.ai1 .dot{animation:breathe 1.2s ease-in-out infinite}

</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Cognitive Plan Builder engine: parsing, profiling, gating, prescription. Plain JS, no dependencies. */
(function (root) {
  'use strict';

  /* ---------- statistics ---------- */
  // Acklam inverse normal CDF approximation (abs error < 1.2e-9)
  function qnorm(p) {
    if (p <= 0) return -Infinity; if (p >= 1) return Infinity;
    var a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    var pl = 0.02425, q, r;
    if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    if (p > 1 - pl) { q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    q = p - 0.5; r = q * q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5]) * q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }
  function pctToZ(pct) { var p = Math.min(99.5, Math.max(0.5, pct)) / 100; return qnorm(p); }

  /* ---------- CANTAB measures ---------- */
  var MEASURES = [
    { key: 'pal',       label: 'Episodic memory',    test: 'PAL',  domain: 'memory',   re: /Episodic\s+Memory/i,      unit: 'errors' },
    { key: 'swm_err',   label: 'Working memory',     test: 'SWM',  domain: 'executive',re: /Working\s+Memory(?!\s+test)/i, unit: 'between-errors' },
    { key: 'swm_strat', label: 'Executive strategy', test: 'SWM',  domain: 'executive',re: /Executive\s+Function/i,   unit: 'strategy' },
    { key: 'mts_speed', label: 'Processing speed',   test: 'MTS',  domain: 'speed',    re: /Processing\s+Speed/i,     unit: 'ms' },
    { key: 'mts_att',   label: 'Attention',          test: 'MTS',  domain: 'speed',    re: /\bAttention\b/i,          unit: 'ms' }
  ];
  var MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  function parseCantab(raw) {
    var text = String(raw || '').replace(/ /g, ' ');
    var flat = text.replace(/[ \t]+/g, ' ');
    var out = { demo: {}, measures: {}, found: 0 };

    var m = /Date\s+of\s+Birth:?\s*(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*[\/.-]\s*(\d{4})/i.exec(flat);
    var dob = null;
    if (m) {
      var a = +m[1], b = +m[2], y = +m[3];
      var day = a, mon = b; if (b > 12 && a <= 12) { day = b; mon = a; }
      dob = new Date(Date.UTC(y, mon - 1, day));
    }
    var ad = null;
    m = /Assessment\s+Date:?\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i.exec(flat);
    if (m) { var mi = MONTHS.indexOf(m[2].toLowerCase()); if (mi >= 0) ad = new Date(Date.UTC(+m[3], mi, +m[1])); }
    if (dob && ad) {
      var age = ad.getUTCFullYear() - dob.getUTCFullYear();
      var before = (ad.getUTCMonth() < dob.getUTCMonth()) || (ad.getUTCMonth() === dob.getUTCMonth() && ad.getUTCDate() < dob.getUTCDate());
      out.demo.age = before ? age - 1 : age;
    }
    if (ad) out.demo.assessDate = ad.toISOString().slice(0, 10);
    m = /Gender:?\s*([A-Za-z]+)/i.exec(flat); if (m) out.demo.sex = m[1].toLowerCase();
    m = /Level\s+of\s+Education:?\s*(.+?)(?=\s{2,}|\n|Cognitive\s+Assessment|$)/i.exec(text.replace(/[ \t]{2,}/g, '  '));
    if (m) out.demo.education = m[1].trim().slice(0, 60);

    // locate first occurrence of each label (the table row precedes the explanatory notes)
    var pos = MEASURES.map(function (ms) {
      var idx = flat.search(/Cognitive\s+Assessment/i); idx = idx < 0 ? 0 : idx;
      var r = ms.re.exec(flat.slice(idx)); return r ? idx + r.index : -1;
    });
    var order = pos.map(function (p, i) { return { p: p, i: i }; }).filter(function (o) { return o.p >= 0; }).sort(function (x, y) { return x.p - y.p; });
    order.forEach(function (o, n) {
      var end = n + 1 < order.length ? order[n + 1].p : Math.min(flat.length, o.p + 320);
      var seg = flat.slice(o.p, end);
      var pct, rawv, lo, hi, r, ok = false;
      function accept(p, rw, l, h) { if (p >= 1 && p <= 99 && p >= l && p <= h) { pct = p; rawv = rw; lo = l; hi = h; ok = true; } }
      // A: percentile, raw, range (pdftotext layout order)
      r = /(\d{1,3})\s+(-?\d+(?:\.\d+)?)\s+(\d{1,3})\s*-\s*(\d{1,3})/.exec(seg);
      if (r) accept(+r[1], +r[2], +r[3], +r[4]);
      // B: raw, range, (TEST), percentile (pdf.js order)
      if (!ok) { r = /(-?\d+(?:\.\d+)?)\s+(\d{1,3})\s*-\s*(\d{1,3})\s*(?:\(\w+\))?\s*(\d{1,3})(?!\d|\.)/.exec(seg); if (r) accept(+r[4], +r[1], +r[2], +r[3]); }
      // C: percentile extracted just before the label
      if (!ok) {
        var r2 = /(-?\d+(?:\.\d+)?)\s+(\d{1,3})\s*-\s*(\d{1,3})/.exec(seg);
        var pre = /(\d{1,3})\s*$/.exec(flat.slice(Math.max(0, o.p - 14), o.p));
        if (r2 && pre) accept(+pre[1], +r2[1], +r2[2], +r2[3]);
      }
      if (!ok) return;
      out.measures[MEASURES[o.i].key] = { pct: pct, raw: rawv, lo: lo, hi: hi };
      out.found++;
    });
    return out;
  }

  // pages: array of arrays of {str, x, y} (pdf.js text items). Groups into lines by y, orders by x.
  function itemsToText(pages) {
    return pages.map(function (items) {
      var its = items.filter(function (i) { return i.str && i.str.trim(); }).sort(function (a, b) { return b.y - a.y || a.x - b.x; });
      var lines = [], cur = null;
      its.forEach(function (i) {
        if (cur && Math.abs(cur.y - i.y) <= 6) cur.items.push(i); else { cur = { y: i.y, items: [i] }; lines.push(cur); }
      });
      return lines.map(function (l) { return l.items.sort(function (a, b) { return a.x - b.x; }).map(function (i) { return i.str.trim(); }).join('   '); }).join('\n');
    }).join('\n');
  }

  /* ---------- MoCA ---------- */
  var MOCA_DOMAINS = [
    { key: 'vse',         label: 'Visuospatial / executive', max: 5, domain: 'visuospatial', cut: [2, 3] },
    { key: 'naming',      label: 'Naming',                   max: 3, domain: 'language',     cut: [1, 2] },
    { key: 'attention',   label: 'Attention',                max: 6, domain: 'speed',        cut: [3, 4] },
    { key: 'language',    label: 'Language (repetition, fluency)', max: 3, domain: 'language', cut: [1, 2] },
    { key: 'abstraction', label: 'Abstraction',              max: 2, domain: 'executive',    cut: [0, 1] },
    { key: 'recall',      label: 'Delayed recall (free)',    max: 5, domain: 'memory',       cut: [2, 3] },
    { key: 'orientation', label: 'Orientation',              max: 6, domain: 'orientation',  cut: [3, 4] }
  ];
  function mocaMIS(mo) {
    if (mo.recall == null || mo.catCued == null || mo.mcCued == null) return null;
    return 3 * mo.recall + 2 * mo.catCued + 1 * mo.mcCued;
  }

  var DOMAINS = {
    speed:        { label: 'Processing speed and attention' },
    memory:       { label: 'Episodic memory' },
    executive:    { label: 'Executive function and working memory' },
    visuospatial: { label: 'Visuospatial' },
    language:     { label: 'Language' }
  };

  /* ---------- module library ---------- */
  var MODULES = {
    M1: { name: 'Speed and divided attention', domain: 'speed', order: 1,
      evidence: 'Best-supported single target: in ACTIVE (cognitively normal older adults) each speed-training session was associated with a lower dementia hazard (HR 0.90 per session; speed-training group HR 0.71, CI 0.50 to 0.998). Trial-level evidence, not MCI-specific.',
      tasks: ['Visual search under time pressure: find a named item on a busy shelf, supermarket aisle or timetable board, then repeat faster.', 'Dual-task walking: walk a familiar route while naming items from a category (animals, shops).', 'Card sorting or snap against the clock, raising speed only when accuracy stays above about 85 percent.'],
      app: 'Adaptive visual-attention and useful-field-of-view style games; difficulty tracks accuracy, display time shortens as the patient improves.' },
    M2: { name: 'Episodic memory (strategy-led)', domain: 'memory', order: 2,
      evidence: 'Verbal episodic memory shows moderate gains after training in MCI (SMD 0.55 in a 2023 npj Digit Med meta-analysis; 0.72 when supervised). Strategy teaching (chunking, visual imagery, association) outperforms rote repetition.',
      tasks: ['Face-name practice at the next social event: repeat the name, link it to a visual image or feature, use it three times in conversation.', 'Shopping list without paper: group items into 3 to 4 categories, rehearse, then check against a written list.', 'Evening recall: three specific events of the day told to a partner, with spaced re-test the next morning.'],
      app: 'Spaced-retrieval, face-name and object-location games with strategy prompts that fade as performance improves.' },
    M3: { name: 'Working memory (embedded)', domain: 'executive', order: 3,
      evidence: 'Delivered inside M2 and M4 rather than stand-alone: near-transfer to trained tasks is consistent but far transfer is weak.',
      tasks: ['Mental arithmetic of bills or change before looking at the total.', 'Repeat a phone number or directions back before writing them down.', 'Recipe step recall: read two steps, cook them, read the next two.'],
      app: 'N-back style and sequence-span tasks embedded in the memory and executive sessions.' },
    M4: { name: 'Executive function and planning', domain: 'executive', order: 4,
      evidence: 'Limited direct evidence for domain-specific executive training; rationale-based (Grade D). Goal-management style training has small-trial support.',
      tasks: ['Plan a three-course meal from scratch: list steps, order them, cost them, then cook it.', 'Weekly pill organiser set up by the patient, with a checklist and a self-audit on day 7.', 'Plan a journey with a change of transport using a timetable, stating a backup if it fails.'],
      app: 'Planning, task-switching and rule-learning games (route planning, sorting rules that change without warning).' },
    M5: { name: 'Visuospatial', domain: 'visuospatial', order: 5,
      evidence: 'Limited domain-specific evidence (Grade D); selected on MoCA performance because CANTAB visuospatial measures are not in this report.',
      tasks: ['Navigate to a new place using a paper map, then without it; sketch the route afterwards.', 'Jigsaw or tangram puzzles with a time-free target of finishing independently.', 'Clock drawing and floor-plan sketching of the home with furniture placed.'],
      app: 'Mental rotation, spatial navigation and pattern-construction tasks.' },
    M6: { name: 'Language and word finding', domain: 'language', order: 6,
      evidence: 'Limited domain-specific evidence (Grade D). Naming and fluency practice is low-risk and combines naturally with social activity.',
      tasks: ['Category fluency sprints: name as many items as possible in 60 seconds, then beat the number.', 'Picture or object naming around the home with a self-cue (first letter, use) before looking at the answer.', 'Daily reading aloud then summarising a paragraph in one sentence.'],
      app: 'Naming, semantic fluency and word-retrieval games with phonemic cueing.' },
    M7: { name: 'Compensatory toolkit (all patients)', domain: null, order: 7,
      evidence: 'Compensatory strategies and external aids are low-risk, patient-controlled and relevant at every severity; delivered alongside the training rather than instead of it.',
      tasks: ['One calendar and one notebook, always in the same place; check at fixed times.', 'Fixed home for keys, glasses, phone and wallet; a habit of announcing the placement aloud.', 'Phone reminders for medicines and appointments; a weekly 10-minute review with a family member.'],
      app: 'Reminder, routine and note-taking scaffold built into the app home screen.' }
  };

  var LIFESTYLE = [
    'Physical activity: regular aerobic exercise as medically safe, at least twice weekly (AAN 2018 practice guideline, Level B for MCI); the most strongly supported single intervention.',
    'Vascular risk: blood pressure, lipids and glucose reviewed against targets; smoking and alcohol addressed.',
    'Sensory: hearing and vision corrected before and during training.',
    'Sleep, mood and social engagement screened and treated; low mood and poor sleep can mimic or worsen cognitive deficits.',
    'Diet: Mediterranean-style pattern as part of the multidomain scaffold (FINGER, US POINTER).'
  ];

  /* ---------- analysis ---------- */
  function num(v) { return (v === '' || v == null || isNaN(+v)) ? null : +v; }

  function analyse(inp) {
    var trace = [];
    var cantab = inp.cantab || {};
    var moca = inp.moca || {};
    var clin = inp.clinical || {};
    var checks = clin.checks || {};
    var dx = clin.dx || 'unsure';

    // CANTAB per-measure
    var rows = [];
    MEASURES.forEach(function (ms) {
      var pct = num(cantab[ms.key]);
      if (pct == null) return;
      pct = Math.min(99, Math.max(1, Math.round(pct)));
      var z = pctToZ(pct);
      rows.push({ key: ms.key, label: ms.label, test: ms.test, domain: ms.domain, pct: pct, z: z, level: z <= -1.5 ? 2 : z <= -1.0 ? 1 : 0, raw: cantab[ms.key + '_raw'] });
    });
    var meanZ = rows.length ? rows.reduce(function (s, r) { return s + r.z; }, 0) / rows.length : null;
    rows.forEach(function (r) {
      r.relative = rows.length >= 3 && (meanZ - r.z) >= 1.0 && r.level < 2;
      if (r.relative && r.level === 0 && r.z < -0.5) r.level = 1;
      trace.push('CANTAB ' + r.label + ': percentile ' + r.pct + ' = z ' + r.z.toFixed(2) + (r.level === 2 ? ' (impaired, z <= -1.5)' : r.level === 1 ? ' (borderline, z -1.0 to -1.5' + (r.relative ? ' or relative weakness' : '') + ')' : ' (within expected range)') + (r.relative ? '; at least 1 SD below own mean (' + meanZ.toFixed(2) + ')' : ''));
    });

    // MoCA per-domain
    var mrows = [];
    MOCA_DOMAINS.forEach(function (md) {
      var v = num(moca[md.key]);
      if (v == null) return;
      v = Math.min(md.max, Math.max(0, v));
      var level = v <= md.cut[0] ? 2 : v <= md.cut[1] ? 1 : 0;
      mrows.push({ key: md.key, label: md.label, score: v, max: md.max, domain: md.domain, level: level });
      trace.push('MoCA ' + md.label + ': ' + v + '/' + md.max + (level === 2 ? ' (low, <= ' + md.cut[0] + ')' : level === 1 ? ' (borderline, <= ' + md.cut[1] + ')' : ' (acceptable)'));
    });
    var total = num(moca.total);
    var mis = mocaMIS({ recall: num(moca.recall), catCued: num(moca.catCued), mcCued: num(moca.mcCued) });
    if (mis != null) trace.push('MoCA Memory Index Score (MIS) = ' + mis + '/15 (3 x free + 2 x category-cued + 1 x multiple-choice-cued); indicative only, weakly replicated');
    var misLow = mis != null && mis <= 7; // heuristic

    // domain roll-up
    var dom = {};
    Object.keys(DOMAINS).forEach(function (k) { dom[k] = { key: k, label: DOMAINS[k].label, level: 0, sources: [] }; });
    rows.forEach(function (r) { var d = dom[r.domain]; d.sources.push('CANTAB ' + r.label + ' (' + r.pct + 'th pct)'); if (r.level > d.level) d.level = r.level; });
    mrows.forEach(function (r) { if (!dom[r.domain]) return; var d = dom[r.domain]; d.sources.push('MoCA ' + r.label + ' ' + r.score + '/' + r.max); if (r.level > d.level) d.level = r.level; });
    if (misLow && dom.memory.level < 2) { dom.memory.level = Math.max(dom.memory.level, 1); dom.memory.sources.push('MoCA MIS ' + mis + '/15'); }
    // discordance note for memory
    var palRow = rows.filter(function (r) { return r.key === 'pal'; })[0];
    var recallRow = mrows.filter(function (r) { return r.key === 'recall'; })[0];
    var discord = [];
    if (palRow && recallRow && ((palRow.level === 2 && recallRow.level === 0) || (palRow.level === 0 && recallRow.level === 2))) discord.push('CANTAB PAL and MoCA delayed recall disagree about memory; repeat or clinically correlate before targeting.');

    var domains = Object.keys(dom).map(function (k) { return dom[k]; });
    var any = domains.some(function (d) { return d.level > 0; });
    var impairedDomains = domains.filter(function (d) { return d.level === 2; });
    var flagged = domains.filter(function (d) { return d.level > 0; });

    // pattern
    var pattern;
    if (!any && (rows.length || mrows.length)) pattern = 'No domain flagged on the entered scores';
    else if (!rows.length && !mrows.length) pattern = 'No scores entered';
    else {
      var amn = dom.memory.level > 0;
      var nonMem = flagged.filter(function (d) { return d.key !== 'memory'; });
      pattern = (amn ? 'Amnestic' : 'Non-amnestic') + ', ' + (flagged.length > 1 ? 'multiple-domain' : 'single-domain') + (nonMem.length ? ' (' + nonMem.map(function (d) { return d.label.toLowerCase(); }).join(', ') + ')' : '');
    }

    // gate
    var holds = [], cautions = [];
    var floorN = rows.filter(function (r) { return r.level === 2; }).length;
    var floorExtreme = rows.filter(function (r) { return r.pct <= 5; }).length;
    if (total != null && total < 18) holds.push('MoCA total ' + total + ' is below 18, the range more usually seen in dementia. Confirm diagnosis and everyday function before using an MCI/SCI programme.');
    if (num(moca.orientation) != null && num(moca.orientation) <= 3) holds.push('MoCA orientation ' + num(moca.orientation) + '/6 is markedly low. Exclude delirium and dementia first.');
    if (rows.length >= 3 && floorN >= 3) holds.push(floorN + ' of ' + rows.length + ' CANTAB measures are in the impaired range (' + floorExtreme + ' at or below the 5th percentile). Pervasive floor-level results more often reflect dementia-range impairment, or a confound (effort, vision, motor control, touchscreen use, delirium, medication). Verify before interpreting domain by domain.');
    if (checks.function === false) holds.push('Everyday independence not confirmed. Functional impairment points away from MCI/SCI.');
    var unchecked = [];
    if (checks.sensory === false) unchecked.push('vision and hearing adequate');
    if (checks.motor === false) unchecked.push('motor ability adequate for touchscreen use');
    if (checks.mood === false) unchecked.push('mood and sleep screened');
    if (checks.reversible === false) unchecked.push('reversible contributors reviewed (B12, thyroid, medicines, alcohol)');
    if (unchecked.length) cautions.push('Not yet confirmed: ' + unchecked.join('; ') + '. Resolve before issuing the prescription.');
    if (checks.device === false) cautions.push('Low comfort with devices: start supervised in clinic or at home with a carer; do not rely on unsupervised use.');
    if (dx === 'SCI' && (flagged.length || (total != null && total < 26))) cautions.push('Labelled SCI but objective scores are below expectation. Consider reclassifying as MCI after clinical review.');
    if (dx === 'MCI' && rows.length + mrows.length > 0 && !any && (total == null || total >= 26)) cautions.push('Labelled MCI but entered scores are within the expected range. Re-check the diagnosis or whether the deficit is domain-specific and not captured here.');
    discord.forEach(function (d) { cautions.push(d); });
    if (rows.length && rows.length < 5) cautions.push('Only ' + rows.length + ' of 5 CANTAB measures entered; the profile is partial.');
    if (!mrows.length && total == null) cautions.push('No MoCA entered: visuospatial, language and orientation are not assessed in this plan.');

    var status = holds.length ? 'hold' : unchecked.length ? 'provisional' : 'proceed';
    holds.forEach(function (h) { trace.push('GATE HOLD: ' + h); });
    unchecked.forEach(function (u) { trace.push('GATE PROVISIONAL: ' + u + ' not confirmed'); });

    // module selection
    var cand = [];
    ['M1', 'M2', 'M4', 'M5', 'M6'].forEach(function (id) {
      var m = MODULES[id], d = dom[m.domain];
      if (d.level > 0) cand.push({ id: id, level: d.level, order: m.order, reason: d.label + ' ' + (d.level === 2 ? 'impaired' : 'borderline') + ' (' + d.sources.join('; ') + ')' });
    });
    cand.sort(function (a, b) { return b.level - a.level || a.order - b.order; });
    var core = cand.slice(0, 3), deferred = cand.slice(3);
    var wmFlag = rows.some(function (r) { return r.key === 'swm_err' && r.level > 0; });
    if (wmFlag && core.length < 3) core.push({ id: 'M3', level: 1, order: 3, reason: 'Working memory below expectation (CANTAB SWM)' });
    var generalAnchor = false;
    if (!core.length && (dx === 'MCI' || (total != null && total < 26))) {
      core = [{ id: 'M1', level: 0, order: 1, reason: 'No domain flagged; speed and divided attention offered as a general anchor module (best-supported target)' }];
      generalAnchor = true;
    }
    var stratRow = rows.filter(function (r) { return r.key === 'swm_strat'; })[0];
    var notes = [];
    if (wmFlag) notes.push('Working-memory weakness: M3 practice is added as its own module when there is room, and embedded in memory and executive sessions otherwise.');
    if (dom.memory.level === 2 && stratRow && stratRow.pct >= 50) notes.push('Memory impaired but search strategy preserved (strategy percentile ' + stratRow.pct + '): favourable for strategy-led encoding training in M2.');
    if (dom.memory.level === 2 && stratRow && stratRow.pct < 25) notes.push('Memory and strategy use both reduced: weight M7 external aids heavily and keep M2 sessions short and supervised.');
    if (dom.speed.level === 2) notes.push('Marked slowing: use generous response windows at the start and confirm the patient is not struggling with the touchscreen itself.');
    core.forEach(function (c) { trace.push('PRESCRIBE ' + c.id + ' ' + MODULES[c.id].name + ': ' + c.reason); });
    deferred.forEach(function (c) { trace.push('DEFER ' + c.id + ' (lower priority than the three core modules): ' + c.reason); });

    // dosing
    var supervisedFirst = status !== 'proceed' || checks.device === false || impairedDomains.length >= 3;
    var dose = {
      weeks: 12, perWeek: 3, minutes: '30 to 40',
      supervised: supervisedFirst ? 'At least 2 of 3 weekly sessions supervised (clinic, carer or tele-supervised)' : 'At least 1 of 3 weekly sessions supervised',
      note: 'Lampit 2014: gains were larger and more reliable with supervised sessions and no more than 3 sessions per week.'
    };
    trace.push('DOSE ' + dose.perWeek + ' x ' + dose.minutes + ' min per week for ' + dose.weeks + ' weeks; ' + dose.supervised.toLowerCase());

    // weekly template: split ~35 min into blocks across core modules, rotate emphasis
    var schedule = [];
    var names = core.map(function (c) { return c.id; });
    var nS = Math.max(1, names.length);
    var sess = ['Session A', 'Session B', 'Session C'];
    sess.forEach(function (s, i) {
      var blocks = [];
      if (names.length === 0) blocks = [{ id: 'M7', mins: 20 }];
      else if (names.length === 1) blocks = [{ id: names[0], mins: 30 }];
      else {
        var lead = names[i % nS], second = names[(i + 1) % nS];
        blocks = [{ id: lead, mins: 20 }, { id: second, mins: 12 }];
      }
      if (wmFlag && names.indexOf('M2') >= 0 || wmFlag && names.indexOf('M4') >= 0) { /* WM embedded; no separate block */ }
      schedule.push({ name: s, blocks: blocks });
    });

    };
  }

  var GAME_URL = 'https://claude.ai/artifact/14P3CKfgAi2hLRJoCWFfW7';
  function rxCode(res, startISO) {
    var mods = res.core.map(function (c) { return c.id; }).filter(function (id) { return /^M[1-6]$/.test(id); });

  function toText(res, label, rx) {

    L.push('Draft decision support. Rules are unvalidated (Grade D). Clinician judgement overrides.');
    L.push('');

    res.holds.forEach(function (h) { L.push('  HOLD: ' + h); });
    res.cautions.forEach(function (c) { L.push('  Note: ' + c); });
    L.push('');
    L.push('PROFILE: ' + res.pattern);
    res.domains.forEach(function (d) { if (d.sources.length) L.push('  ' + d.label + ': ' + ['within range', 'borderline', 'impaired'][d.level] + ' [' + d.sources.join('; ') + ']'); });

    L.push('PRESCRIPTION: ' + res.dose.perWeek + ' sessions per week, ' + res.dose.minutes + ' min, ' + res.dose.weeks + ' weeks. ' + res.dose.supervised + '.');
    res.core.forEach(function (c) {
      var m = MODULES[c.id]; L.push(''); L.push(c.id + ' ' + m.name + ' - ' + c.reason);
      m.tasks.forEach(function (t) { L.push('  - ' + t); });
    });

    L.push(''); L.push('M7 ' + MODULES.M7.name);
    MODULES.M7.tasks.forEach(function (t) { L.push('  - ' + t); });
    res.notes.forEach(function (n) { L.push(''); L.push('Note: ' + n); });

    await ctx.say(prompt);
    await ctx.next(sbox, secs === 60 ? 'Start the minute' : 'Start');
    stopSpeech();

      raw = String(raw || '').trim(); if (!raw) return;
      var key, rec;
      if (letterMode){ var w = raw.toLowerCase().replace(/[^a-z\s-]/g, '').trim(); if (!w) return; key = wordKey(w); rec = w.charAt(0) === cat.toLowerCase() && w.length >= 2; if (!rec){ chips.appendChild(h('span', {class:'un', 'data-notr':'1', text:w})); return; } }

      rep.addEventListener('click', function(){ tallyRep++; hist.push('r'); });
      undo.addEventListener('click', function(){ var x = hist.pop(); if (x === 'w'){ tally--; cntEl.textContent = String(tally); } else if (x === 'r') tallyRep--; });
      return h('div', {style:{display:'flex', flexDirection:'column', gap:'10px', alignItems:'center'}}, [cntEl, h('p', {class:'muted', text:'words counted'}), h('div', {class:'btnrow'}, [plus, rep, undo])]);

    }

    rows: det.map(function(d){ return ['Round', d]; }).concat([['How answers were given', inputLabel(how)]]), note:'Compare sessions done the same way (spoken, helper or typed): the method changes the score.' };

async function m6name(root, ctx, mode, how){
  var gap = mode === 'gap', N = ctx.practice ? 3 : 10;
  var items = gap ? (LANG === 'hi' ? shuffle(GAPS_HI).slice(0, N).map(function(g){ return {show:g[0], disp:g[1], ans:g[2].split(',')}; }) : shuffle(GAPS).slice(0, N).map(function(g){ var a = g[1].split(','); return {show:g[0], disp:a[0], ans:a}; }))

  for (var i=0;i<items.length;i++){

      var outcome;

        var helpTxt = h('p', {class:'muted', style:{textAlign:'center'}, text: L('For the helper: the answer is ', 'सहायक के लिए: उत्तर है ')+it.disp});
        extra.appendChild(helpTxt);

          var mic = h('button', {type:'button', class:'go', text:'🎤 Speak'}); mic.addEventListener('click', function(){ if (r) r.start(); });
          var okB = h('button', {type:'button', class:'ghost small', text:'✓ It was right (helper)'}); okB.addEventListener('click', function(){ fin('ok'); });

async function m6sort(root, ctx){
  var ROUNDS = ctx.practice ? 1 : 4, cats = Object.keys(SORTSET), hitsAll = 0, faAll = 0, missAll = 0, totalT = 0, rates = [];
  var p = prog();
  for (var r=0;r<ROUNDS;r++){
    clear(root); setProg(p, r/ROUNDS); root.append(p);
    var cat = cats[(r + rnd(0, cats.length-1)) % cats.length], nT = 5 + Math.min(2, r), targets = shuffle(SORTSET[cat]).slice(0, nT);
    var others = []; cats.forEach(function(c){ if (c !== cat) others = others.concat(SORTSET[c]); });
    var tiles = shuffle(targets.concat(shuffle(others).slice(0, 16 - nT)));
    var label = L(SORT_LABEL[cat][0], SORT_LABEL[cat][1]), prompt = L('Tap all the '+label, 'सारे '+label+' पर टैप कीजिए');
    var g = h('div', {class:'gridn sortgrid', style:{gridTemplateColumns:'repeat(4,1fr)'}}), ctl = h('div', {class:'btnrow'}), fb = h('p', {class:'fb'});
    root.append(h('p', {class:'tag2', text: ctx.practice ? 'Practice' : 'Round '+(r+1)+' of '+ROUNDS}), h('p', {class:'big', 'data-notr':'1', text:prompt}), speakBtn(prompt), g, ctl, fb);
    await ctx.say(prompt);
    var chosen = {}, t0 = performance.now();
    tiles.forEach(function(e, i){ var b = h('button', {type:'button', class:'cell live', 'aria-pressed':'false', 'data-notr':'1', text:e, style:{fontSize:'clamp(28px,8vw,44px)'}}); b.addEventListener('click', function(){ chosen[i] = !chosen[i]; b.classList.toggle('sel', !!chosen[i]); b.setAttribute('aria-pressed', chosen[i] ? 'true' : 'false'); }); g.appendChild(b); });
    await ctx.next(ctl, 'Done'); clear(ctl);
    var secs = (performance.now() - t0)/1000*SPEED, hits = 0, fa = 0;
    tiles.forEach(function(e, i){ var isT = targets.indexOf(e) >= 0, b = g.children[i]; b.disabled = true; b.classList.remove('live'); if (isT) b.classList.add('right'); if (chosen[i] && !isT) b.classList.add('wrong'); if (chosen[i]) (isT ? hits++ : fa++); });
    var miss = nT - hits; hitsAll += hits; faAll += fa; missAll += miss; totalT += secs; rates.push(Math.max(0, hits - fa)/Math.max(secs, 1)*60);
    fb.textContent = L(hits+' of '+nT+' found'+(fa ? ', '+fa+' wrong' : ''), nT+' में से '+hits+' सही'+(fa ? ', '+fa+' ग़लत' : '')); fb.className = 'fb '+(miss || fa ? 'bad' : 'good');
    await ctx.wait(1800);

    rows:[['Correct pictures per minute', String(v)],['Found', String(hitsAll)],['Missed', String(missAll)],['Tapped by mistake', String(faAll)]], note:'This is a recognition task. It is easier than saying words from memory, so it is scored separately from the word sprints.' };
}

function rupee(n){ return '₹'+n.toLocaleString('en-IN'); }

async function m8(root, ctx, mode){
  if (mode === 'pills') return m8pills(root, ctx);
  if (mode === 'money') return m8money(root, ctx);
  if (mode === 'calendar') return m8cal(root, ctx);
  return m8safety(root, ctx);
}

async function m8pills(root, ctx){
  var plan = ctx.practice ? [[1, false]] : [[2, false],[3, false],[2, true],[3, true]], okMeds = 0, totMeds = 0, okHidden = 0, totHidden = 0, k = 0;
  var p = prog();
  for (var r=0;r<plan.length;r++){
    var n = plan[r][0], hide = plan[r][1]; if (r >= 2 && k < 0.5) n = Math.max(1, n-1);
    setProg(p, r/plan.length); clear(root); root.append(p);
    var meds = shuffle(MEDS).slice(0, n);
    var card = h('div', {class:'panel rxcard', 'data-notr':'1'}, [h('h3', {text: L('Prescription', 'पर्चा')}), h('p', {class:'muted', text: L('1-0-1 means: morning – afternoon – night', '1-0-1 का मतलब: सुबह – दोपहर – रात')})].concat(meds.map(function(m){ return h('p', {class:'rxline'}, [h('b', {text:m.n}), h('br'), rxLine(m)]); })));
    var ctl = h('div', {class:'btnrow'});
    var inst = hide ? 'Read the prescription carefully. It will be hidden while you fill the pill box.' : 'Fill the pill box using the prescription.';
    root.append(h('p', {class:'tag2', text: ctx.practice ? 'Practice' : 'Prescription '+(r+1)+' of '+plan.length}), h('p', {class:'msg', text:inst}), card, ctl);
    ctx.say(inst);
    if (hide){ await ctx.next(ctl, 'I have read it'); card.hidden = true; stopSpeech(); }
    clear(ctl);
    var rows = h('div', {class:'pillbox', 'data-notr':'1'}), ans = meds.map(function(){ return {s:[0,0,0], f:null}; });
    meds.forEach(function(m, i){
      var slots = h('div', {class:'slots'}), food = h('div', {class:'slots'});
      SLOT.forEach(function(sl, j){ var b = h('button', {type:'button', class:'slotbtn', 'aria-pressed':'false', text:nm(sl)}); b.addEventListener('click', function(){ ans[i].s[j] = ans[i].s[j] ? 0 : 1; b.setAttribute('aria-pressed', ans[i].s[j] ? 'true' : 'false'); b.classList.toggle('sel', !!ans[i].s[j]); }); slots.appendChild(b); });
      ['before','after'].forEach(function(fk){ var b = h('button', {type:'button', class:'slotbtn', 'aria-pressed':'false', text:L(FOOD[fk][0], FOOD[fk][1])}); b.addEventListener('click', function(){ ans[i].f = fk; Array.prototype.forEach.call(food.children, function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed', 'false'); }); b.classList.add('sel'); b.setAttribute('aria-pressed', 'true'); }); food.appendChild(b); });
      rows.appendChild(h('div', {class:'pillrow'}, [h('b', {text:'💊 '+m.n}), slots, food]));

    totMeds += n; okMeds += good; if (hide){ totHidden += n; okHidden += good; } k = good/n;
    card.hidden = false;

async function m8money(root, ctx){
  var types = ctx.practice ? ['total'] : ['total','change','pay','total','change','pay'], ok = 0, p = prog();
  for (var i=0;i<types.length;i++){
    setProg(p, i/types.length); clear(root); root.append(p);
    var n = i < 3 ? 2 : 3, items = shuffle(GOODS).slice(0, n), total = items.reduce(function(s, x){ return s + x[2]; }, 0);
    var bill = h('div', {class:'panel slip', 'data-notr':'1'}, [h('h3', {text: L('Shop bill', 'दुकान का बिल')})].concat(items.map(function(x){ return h('p', {class:'billrow'}, [h('span', {text:L(x[0], x[1])}), h('b', {text:rupee(x[2])})]); })));
    var q = h('p', {class:'big', 'data-notr':'1'}), box = h('div', {class:'btnrow'}), fb = h('p', {class:'fb'}), good = false, qt;
    root.append(h('p', {class:'tag2', text: ctx.practice ? 'Practice' : 'Question '+(i+1)+' of '+types.length}), bill, q, box, fb);
    if (types[i] === 'total'){
      qt = L('What is the total?', 'कुल कितने रुपये हुए?'); q.textContent = qt; ctx.say(qt);
      var o = moneyOpts(total), a = await ctx.ask(box, o.map(rupee)); good = o[a.i] === total;
      fb.textContent = good ? L('Correct: ', 'सही: ')+rupee(total) : L('The total is ', 'कुल है ')+rupee(total);
    } else if (types[i] === 'change'){
      var note = total < 100 ? 100 : total < 200 ? 200 : 500, ch = note - total;
      bill.appendChild(h('p', {class:'billrow total'}, [h('span', {text:L('Total', 'कुल')}), h('b', {text:rupee(total)})]));
      qt = L('You pay with a '+rupee(note)+' note. How much change should you get back?', 'आप '+rupee(note)+' का नोट देते हैं। कितने रुपये वापस मिलने चाहिए?'); q.textContent = qt; ctx.say(qt);
      var o2 = moneyOpts(ch), a2 = await ctx.ask(box, o2.map(rupee)); good = o2[a2.i] === ch;
      fb.textContent = good ? L('Correct: ', 'सही: ')+rupee(ch) : L('The change is ', 'वापसी है ')+rupee(ch);
    } else {
      bill.appendChild(h('p', {class:'billrow total'}, [h('span', {text:L('Total', 'कुल')}), h('b', {text:rupee(total)})]));
      qt = L('Pay the exact amount. Tap the notes and coins you would give.', 'ठीक उतने ही पैसे दीजिए। जो नोट और सिक्के देंगे उन पर टैप कीजिए।'); q.textContent = qt; ctx.say(qt);
      var given = [], shown = h('p', {class:'chips', 'data-notr':'1'}), wallet = h('div', {class:'wallet', 'data-notr':'1'});
      NOTES.forEach(function(v){ var b = h('button', {type:'button', class: v >= 10 ? 'note' : 'coin', text:rupee(v)}); b.addEventListener('click', function(){ given.push(v); shown.appendChild(h('span', {text:rupee(v)})); }); wallet.appendChild(b); });
      var undo = h('button', {type:'button', class:'ghost small', text:'Take back last'}); undo.addEventListener('click', function(){ given.pop(); if (shown.lastChild) shown.removeChild(shown.lastChild); });
      root.insertBefore(wallet, box); root.insertBefore(shown, box); root.insertBefore(h('div', {class:'btnrow'}, [undo]), box);
      await ctx.next(box, 'Pay'); var paid = given.reduce(function(s, x){ return s + x; }, 0); good = paid === total;
      fb.textContent = good ? L('Exactly right: ', 'बिल्कुल सही: ')+rupee(total) : L('You gave '+rupee(paid)+'; the bill was '+rupee(total), 'आपने '+rupee(paid)+' दिए; बिल था '+rupee(total));
    }
    if (good) ok++;
    fb.className = 'fb '+(good ? 'good' : 'bad'); ctx.say(fb.textContent);
    clear(box); await ctx.wait(good ? 1300 : 2600);
  }
  var v = Math.round(ok/types.length*100);
  return { m:{v:v}, headline:'Money tasks correct: '+ok+' of '+types.length, detail:'correct '+ok+'/'+types.length,
    rows:[['Correct', ok+' of '+types.length]], note:'Checking bills and change in your head is good daily practice. Try it at the sabzi shop.' };
}

async function m8cal(root, ctx){
  var rounds = ctx.practice ? [2] : [3, 4], ok = 0, tot = 0, p = prog();
  for (var r=0;r<rounds.length;r++){
    setProg(p, r/rounds.length); clear(root); root.append(p);
    var evs = [], usedD = {};
    shuffle(EVENTS).forEach(function(e){ if (evs.length < rounds[r] && !usedD[e.t+e.d]){ usedD[e.t+e.d] = 1; evs.push(e); } });
    var note = h('div', {class:'panel slip', 'data-notr':'1'}, [h('h3', {text:L('Today is Monday the 10th. Coming up:', 'आज सोमवार, 10 तारीख़ है। आगे क्या है:')})].concat(evs.map(function(e){ return h('p', {class:'billrow'}, [h('span', {text:L(e.what[0], e.what[1])}), h('b', {text: e.t === 'day' ? nm(DAYS[e.d]) : L(e.d+'th', e.d+' तारीख़')})]); })));
    var ctl = h('div', {class:'btnrow'}), inst = 'Read these reminders and try to remember them.';
    root.append(h('p', {class:'tag2', text: ctx.practice ? 'Practice' : 'Round '+(r+1)+' of '+rounds.length}), h('p', {class:'msg', text:inst}), note, speakBtn(function(){ return evs.map(function(e){ return L(e.what[0]+', '+(e.t === 'day' ? DAYS[e.d][0] : 'the '+e.d+'th'), e.what[1]+', '+(e.t === 'day' ? DAYS[e.d][1] : e.d+' तारीख़')); }).join('. '); }), ctl);
    await ctx.say(inst);
    await ctx.wait(3000 + rounds[r]*2000); await ctx.next(ctl, 'I have read it');
    stopSpeech();
    await sumsBreak(root, ctx, ctx.practice ? 6 : 20);
    clear(root); root.append(p);
    var q = h('p', {class:'big', 'data-notr':'1'}), box = h('div', {class:'btnrow'}), fb = h('p', {class:'fb'});
    root.append(q, box, fb);
    for (var i=0;i<evs.length;i++){
      var e = evs[i], qt = L(e.q[0], e.q[1]); q.textContent = qt; fb.textContent = ''; fb.className = 'fb'; ctx.say(qt);
      var opts;
      if (e.t === 'day'){ var ds = [e.d]; while (ds.length < 4){ var x = rnd(0,6); if (ds.indexOf(x) < 0) ds.push(x); } opts = shuffle(ds); var a = await ctx.ask(box, opts.map(function(d){ return nm(DAYS[d]); })); var good = opts[a.i] === e.d; }
      else { var dd = [e.d]; while (dd.length < 4){ var y = e.d + pick([-5,-3,-2,2,3,5]); if (y > 10 && y < 31 && dd.indexOf(y) < 0) dd.push(y); } opts = shuffle(dd); var a2 = await ctx.ask(box, opts.map(function(d){ return L(d+'th', d+' तारीख़'); })); var good = opts[a2.i] === e.d; }
      tot++; if (good) ok++;
      fb.textContent = good ? L('Correct', 'सही') : L('It was ', 'सही उत्तर: ')+(e.t === 'day' ? nm(DAYS[e.d]) : L(e.d+'th', e.d+' तारीख़')); fb.className = 'fb '+(good ? 'good' : 'bad');
      await ctx.wait(good ? 900 : 2000);
    }
  }
  var v = Math.round(ok/tot*100);
  return { m:{v:v}, headline:'Reminders remembered: '+ok+' of '+tot, detail:'correct '+ok+'/'+tot,
    rows:[['Remembered correctly', ok+' of '+tot]], note:'Write appointments on one wall calendar and check it every morning at the same time.' };
}

async function m8safety(root, ctx){
  var set = shuffle(SCAMS).slice(0, ctx.practice ? 1 : 5), ok = 0, p = prog();
  for (var i=0;i<set.length;i++){
    setProg(p, i/set.length); clear(root); root.append(p);

    root.append(h('p', {class:'tag2', text: ctx.practice ? 'Practice' : 'Situation '+(i+1)+' of '+set.length}), h('div', {class:'pair', 'data-notr':'1', style:{fontSize:'21px', textAlign:'left'}, text:story}), speakBtn(story), q, box, fb, ctl);
    await ctx.say(story);
    var opts = s[1].map(function(o){ return L(o[0], o[1]); });
    var a = await ctx.ask(box, opts), good = a.i === s[2]; if (good) ok++;
    Array.prototype.forEach.call(box.children, function(b, j){ b.disabled = true; if (j === s[2]) b.classList.add('right'); else if (j === a.i) b.classList.add('wrong'); });
    fb.textContent = (good ? L('Right. ', 'सही। ') : L('Safer choice is marked green. ', 'सुरक्षित उत्तर हरे रंग में है। '))+L(s[3][0], s[3][1]); fb.className = 'fb '+(good ? 'good' : 'bad');
    ctx.say(fb.textContent);
    await ctx.next(ctl, i < set.length-1 ? 'Next' : 'Finish'); stopSpeech();
  }
  var v = Math.round(ok/set.length*100);
  return { m:{v:v}, headline:'Safe choices: '+ok+' of '+set.length, detail:'correct '+ok+'/'+set.length,
    rows:[['Safe choices', ok+' of '+set.length]], note:'Golden rule: never share an OTP or PIN, and check any money request by calling the person on a number you already know.' };
}

/* scroll reveal + count-up */
function revealAll(root){
  var els = root.querySelectorAll('.rv'), cnts = root.querySelectorAll('.cnt');
  function countUp(el){ if (el.dataset.done) return; el.dataset.done = 1; var to = +el.dataset.to, t0 = performance.now(), d = 1100; if (REDUCED){ el.textContent = to; return; }
    (function f(t){ var p = Math.min(1, (t - t0)/d), e = 1 - Math.pow(1-p, 3); el.textContent = Math.round(to*e); if (p < 1) requestAnimationFrame(f); })(t0); }
  if (!('IntersectionObserver' in window) || REDUCED){ els.forEach(function(e){ e.classList.add('in'); }); cnts.forEach(countUp); return; }
  cnts.forEach(function(e){ e.textContent = '0'; });
  var io = new IntersectionObserver(function(es){ es.forEach(function(en){ if (!en.isIntersecting) return; en.target.classList.add('in'); en.target.querySelectorAll && en.target.querySelectorAll('.cnt').forEach(countUp); if (en.target.classList.contains('cnt')) countUp(en.target); io.unobserve(en.target); }); }, {threshold:.15, rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(e){ io.observe(e); });
  cnts.forEach(function(e){ if (!e.closest('.rv')) io.observe(e); });
  /* safety net: never leave content hidden */
  setTimeout(function(){ els.forEach(function(e){ var r = e.getBoundingClientRect(); if (r.top < innerHeight) e.classList.add('in'); }); }, 1200);
}

/* 10-second teaser: remember the glowing squares */
function teaser(){
  var sec = h('section', {class:'lsec teaser rv', id:'teaser'});
  var grid = h('div', {class:'tgrid'}), msg = h('p', {class:'tmsg', 'aria-live':'polite'}), go = h('button', {type:'button', class:'cta'});
  var cells = [], n = 3, seq = [], pos = 0, busy = false, best = 0;
  for (var i=0;i<9;i++){ (function(i){ var c = h('button', {type:'button', class:'tc', 'aria-label': T('Square ','खाना ')+(i+1), disabled:'disabled'}); c.addEventListener('click', function(){ tap(i); }); cells.push(c); grid.appendChild(c); })(i); }
  function setMsg(t, cls){ msg.textContent = t; msg.className = 'tmsg ' + (cls || ''); }
  function lock(v){ cells.forEach(function(c){ c.disabled = v; }); }
  function flash(c, cls, ms){ c.classList.add(cls); setTimeout(function(){ c.classList.remove(cls); }, ms); }
  function play(){
    if (busy) return; busy = true; go.hidden = true; lock(true); pos = 0;
    seq = []; while (seq.length < n){ var r = Math.floor(Math.random()*9); if (seq[seq.length-1] !== r) seq.push(r); }
    setMsg(T('Watch the squares…','खानों को ध्यान से देखें…'));
    var myRun = run;
    seq.forEach(function(ix, j){ setTimeout(function(){ if (run !== myRun) return; flash(cells[ix], 'lit', 520); }, 500 + j*750); });
    setTimeout(function(){ if (run !== myRun) return; busy = false; lock(false); setMsg(T('Your turn: tap them in the same order','आपकी बारी: उसी क्रम में छुएँ')+' ('+n+')'); }, 500 + n*750);
  }
  function tap(i){
    if (busy) return;
    if (i === seq[pos]){ flash(cells[i], 'ok', 300); pos++;
      if (pos === seq.length){ lock(true); best = Math.max(best, n); setMsg(T('Brilliant! You remembered ','शाबाश! आपको ')+n+T(' squares.',' खाने याद रहे।'), 'good'); burst(grid); if (n < 7) n++; go.textContent = T('Try ','अब ')+n+T(' squares →',' खाने →'); go.hidden = false; }
    } else { lock(true); flash(cells[i], 'no', 600); seq.forEach(function(ix, j){ setTimeout(function(){ flash(cells[ix], 'lit', 420); }, 650 + j*480); });
      setMsg(T('Nearly! Here is the order. Small slips are normal.','लगभग! यह रहा सही क्रम। छोटी भूल आम बात है।'), 'bad'); if (n > 3) n--; go.textContent = T('Try again','फिर से खेलें'); go.hidden = false; }
  }
  go.textContent = T('▶ Start the teaser','▶ खेल शुरू करें'); go.addEventListener('click', play);
  setMsg(T('A tiny taste of Sequence Keeper. Squares will glow; tap them back in order.','क्रम याद रखें खेल की एक झलक। खाने चमकेंगे; उन्हें उसी क्रम में छुएँ।'));
  sec.append(h('div', {class:'ttext'}, [h('span', {class:'eyebrow', text:T('Try it now','अभी आज़माएँ')}), h('h2', {text:T('Can you remember the glowing squares?','क्या आपको चमकते खाने याद रहेंगे?')}), msg, h('div', {class:'btnrow', style:{justifyContent:'flex-start'}}, [go, startBtn2()])]), grid);
  function startBtn2(){ var b = h('button', {type:'button', class:'ghost', text:T('Play the full games','पूरे खेल खेलें')}); b.addEventListener('click', landStart); return b; }
  return sec;
}

function basePayload(type){
  var p = loadProfile() || {}, a = loadHist().filter(function(r){ return r.key !== 'm7'; });
  return {type:type, player:pid(), profile:{lang:LANG||'', name:p.name||'', age:p.age||'', email:p.email||'', mobile:p.mobile||'', consentAt:p.consentAt||null, code:(loadPlan()||{}).code||''}, rx:loadRx() || null, mins:recentMins(), sessions:a.length, lastTs:a.length ? a[0].ts : null};

  if (!SHEET_URL) return;

function parseRx(str){

    if (/^m[1-68]$/.test(x) && mods.indexOf(x) < 0) mods.push(x);
    else if ((m = /^f([1-7])$/.exec(x))) f = +m[1];
    else if ((m = /^w(\d{1,2})$/.exec(x))) w = +m[1];
    else if ((m = /^d(\d{4})(\d{2})(\d{2})$/.exec(x))) start = new Date(+m[1], +m[2]-1, +m[3]).getTime(); });

}
