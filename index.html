/* ===== active minutes: counted only while a game or Daily Anchors is on screen ===== */
var ACTIVE_VIEWS = {play:1, m7:1};
function loadMins(){ return lsGet(KEYS.mins, {}); }
function minsOn(day){ return Math.floor((loadMins()[day] || 0)/60); }
(function(){
  var last = Date.now();
  setInterval(function(){
    var now = Date.now(), gap = Math.min(now - last, 10000); last = now;
    if (!ACTIVE_VIEWS[currentView] || document.hidden) return;
    var m = loadMins(), d = isoDay(now); m[d] = (m[d] || 0) + gap/1000;
    var keys = Object.keys(m).sort(); while (keys.length > 60) delete m[keys.shift()];
    lsSet(KEYS.mins, m);
    if (Math.floor(m[d]/60) !== Math.floor((m[d] - gap/1000)/60)) syncPlayer();
  }, 5000);
})();
function recentMins(){ var m = loadMins(), o = {}; Object.keys(m).sort().slice(-30).forEach(function(d){ o[d] = Math.round(m[d]/60); }); return o; }

/* ===== hub: today panel ===== */
function ringSvg(frac){
  var r = 52, c = 2*Math.PI*r, f = Math.max(0, Math.min(1, frac));
  return '<svg viewBox="0 0 120 120" class="ring" aria-hidden="true"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle class="ringv" cx="60" cy="60" r="'+r+'" fill="none" stroke="'+(f >= 1 ? 'var(--good)' : 'var(--accent)')+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 60 60)"/></svg>';
}
function todayPanel(hist){
  var plan = loadPlan(), day = isoDay(Date.now()), k = todayTask(), done = taskDone(hist, k, day), mins = minsOn(day), target = planTarget();
  var g = GAMES[k];
  var ring = h('div', {class:'ringbox'}, [h('span', {html:ringSvg(mins/target)}), h('div', {class:'ringtxt'}, [h('b', {text:String(Math.min(mins, 999))}), h('span', {text:L('of '+target+' min','/ '+target+' मिनट')})])]);
  var ringMsg = mins >= target ? L('Daily goal reached. Well done!','आज का लक्ष्य पूरा। शाबाश!') : L((target - mins)+' more minutes today', 'आज '+(target - mins)+' मिनट और');
  var tcard = setVars(h('div', {class:'taskcard'+(done ? ' done' : '')}), k);
  var btn = h('button', {type:'button', text: done ? L('Play it again','फिर से खेलें') : L('Start today’s task →','आज का काम शुरू करें →')});
  btn.addEventListener('click', function(){ openGame(k); });
  tcard.append(h('span', {class:'tico', html:ICON[k]}), h('div', {class:'tbody'}, [
    h('span', {class:'eyebrow', text: L('Today’s must-do task','आज का ज़रूरी काम')}),
    h('h3', {text: trWord(g.name)}), h('p', {class:'muted', text: tr(g.trains)+' · '+g.mins}),
    done ? h('p', {class:'okline', text:L('✓ Done for today','✓ आज का पूरा हुआ')}) : null, btn]));
  var p = h('div', {class:'panel todaybox'}, [
    h('div', {class:'ringcol'}, [ring, h('p', {class:'ringmsg', text: ringMsg})]), tcard]);
  var foot = h('div', {class:'todayfoot'});
  if (plan && plan.focus && plan.focus.length) foot.appendChild(h('p', null, [h('b', {text:L('Your plan gives extra practice in: ','आपके प्लान में ज़्यादा अभ्यास: ')}), plan.focus.slice(0,3).map(domName).join(' · ')]));
  foot.appendChild(h('p', {class:'muted', text:L('After the must-do task, play any game you like. Aim for at least '+target+' minutes a day.','ज़रूरी काम के बाद कोई भी खेल खेलें। रोज़ कम से कम '+target+' मिनट का लक्ष्य रखें।')}));
  p.appendChild(foot);
  return p;
}
function focusGames(){ var p = loadPlan(); if (!p || !p.weights) return {}; var o = {}; Object.keys(p.weights).forEach(function(k){ if (p.weights[k] >= 3) o[k] = 1; }); return o; }

/* patient: enter or change the clinic key */
function keyPanel(msgText){
  var plan = loadPlan();
  var inp = h('input', {type:'text', 'aria-label':'Clinic key', placeholder:'ABCD-2345', autocomplete:'off', autocapitalize:'characters', spellcheck:'false'}), ap = h('button', {type:'button', class:'ghost', text:'Apply'}), st = h('p', {class:'err'});
  ap.addEventListener('click', async function(){ st.textContent = ''; ap.disabled = true;
    try { var np = await fetchPlan(inp.value); savePlan(np); var pr = loadProfile(); if (pr){ pr.code = np.code; lsSet(KEYS.prof, pr); } syncPlayer(); showHub(); }
    catch(e){ st.textContent = keyError(e); ap.disabled = false; } });
  var kids = [h('h3', {text: plan ? 'Your clinic key' : 'Have a key from your clinic?'})];
  if (plan) kids.push(h('p', null, [h('b', {'data-notr':'1', text:fmtCode(plan.code)}), plan.inactive ? h('span', {class:'err', text:' · '+tr('This key is no longer active. Please ask your clinic.')}) : null]));
  if (msgText) kids.push(h('p', {class:'muted', text:msgText}));
  kids.push(h('div', {class:'rowin'}, [inp, ap]), st);
  return kids;
}
function keyError(e){
  return e.code === 'unknown' ? tr('That key was not found. Please check it with your clinic.')
       : e.code === 'inactive' ? tr('This key is no longer active. Please ask your clinic.')
       : tr('Could not check the key. Please check your internet connection.');
}

/* ===== clinician: patient keys ===== */
ADMIN.plans = ADMIN.plans || [];
async function postOrg(body){ body.key = lsGet('bts2-orgkey', ''); return post(body); }
function shareText(code){ var url = location.origin + location.pathname + '?key=' + code; return 'Your Brain Training Studio key is ' + fmtCode(code) + '. Open ' + url + ' and play at least 15 minutes every day.\nआपकी ब्रेन ट्रेनिंग स्टूडियो की कुंजी ' + fmtCode(code) + ' है। रोज़ कम से कम 15 मिनट खेलें।'; }
function copyBtn(text, label){
  var b = h('button', {type:'button', class:'ghost small', text:label || 'Copy'});
  b.addEventListener('click', function(){ var done = function(){ b.textContent = '✓ Copied'; setTimeout(function(){ b.textContent = label || 'Copy'; }, 1800); };
    try { navigator.clipboard.writeText(text).then(done, function(){ prompt('Copy this:', text); }); } catch(e){ prompt('Copy this:', text); } });
  return b;
}
async function showKeys(){
  page('admin');
  if (!SYNC.owner){ showOrgLogin(); return; }
  var back = h('button', {type:'button', class:'ghost small', text:'← Organiser view'}); back.addEventListener('click', showAdmin);
  app.append(back, h('div', null, [h('span', {class:'eyebrow', text:'Clinician'}), h('h1', {text:'Patient keys'}),
    h('p', {class:'muted', text:'Enter MoCA or CANTAB results here, not on the patient’s device. Each key carries a plan that gives more practice to the weaker domains. Patients only type the key.'})]));
  var row = h('div', {class:'btnrow', style:{justifyContent:'flex-start'}});
  var nb = h('button', {type:'button', text:'＋ New patient key'}); nb.addEventListener('click', function(){ showKeyForm(null, 'patient'); });
  var gb = h('button', {type:'button', class:'ghost', text:'＋ General key (friends, no tests)'}); gb.addEventListener('click', function(){ showKeyForm(null, 'general'); });
  row.append(nb, gb); app.appendChild(row);
  var status = h('p', {class:'muted', text:'Loading…'}); app.appendChild(status);
  var tok = run, players;
  try { players = await loadAll(); } catch(e){ if (tok !== run) return; status.textContent = 'Could not load keys. Check your connection.'; return; }
  if (tok !== run) return; status.remove();
  var count = {}; players.forEach(function(pl){ var c = pl.p.code; if (c) count[c] = (count[c]||0)+1; });
  var plans = (ADMIN.plans || []).slice().sort(function(a,b){ return (b.updated||0)-(a.updated||0); });
  var tb = h('tbody');
  plans.forEach(function(pl){
    var tr_ = h('tr', {class:'click', tabindex:'0'}, [
      h('td', null, [h('b', {class:'code', text:fmtCode(pl.code)}), pl.active ? null : h('span', {class:'err', text:' off'})]),
      h('td', {text:pl.label || '–'}), h('td', {text: pl.type === 'general' ? 'General' : 'Patient'}),
      h('td', {text: (pl.focus||[]).map(function(d){ return DOM_LABEL[d] ? DOM_LABEL[d][1] : d; }).slice(0,3).join(', ') || 'Balanced'}),
      h('td', {text:String(count[pl.code] || 0)}), h('td', {text: pl.updated ? fmtDate(pl.updated) : '–'})]);
    function go(){ showKeyForm(pl, pl.type); } tr_.addEventListener('click', go); tr_.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    tb.appendChild(tr_);
  });
  var tbl = h('div', {class:'panel'}, [h('h3', {text:'Keys'}), h('div', {class:'tw'}, [h('table', null, [h('thead', null, [h('tr', null, ['Key','Label','Type','Focus','Players','Updated'].map(function(t){ return h('th', {text:t}); }))]), tb])])]);
  if (!plans.length) tbl.appendChild(h('p', {text:'No keys yet. Make one with the buttons above.'}));
  app.appendChild(tbl); footer();
}

function showKeyForm(plan, type){
  page('admin'); var E = window.Engine, isNew = !plan; plan = plan || {type:type, weights:{}, scores:{}, minutes:15, active:true};
  var general = (plan.type || type) === 'general', sc = plan.scores || {}, manual = !!(plan.scores && plan.scores.manual);
  var back = h('button', {type:'button', class:'ghost small', text:'← Patient keys'}); back.addEventListener('click', showKeys);
  app.append(back, h('div', null, [h('span', {class:'eyebrow', text: general ? 'General key' : 'Patient key'}),
    h('h1', {text: isNew ? (general ? 'New general key' : 'New patient key') : 'Key '+fmtCode(plan.code)})]));
  var p = h('div', {class:'panel'}); app.appendChild(p);
  function field(label, val, ph, help){ var inp = h('input', {type:'text', placeholder:ph || '', autocomplete:'off', spellcheck:'false'}); inp.value = val == null ? '' : val;
    p.appendChild(h('div', {style:{display:'flex', flexDirection:'column', gap:'6px'}}, [h('label', {style:{fontWeight:'700'}, text:label}), inp, help ? h('p', {class:'muted', text:help}) : null])); return inp; }
  var fLabel = field(general ? 'Name for this key' : 'Patient label', plan.label, general ? 'e.g. Friends test group' : 'e.g. initials or clinic number', general ? null : 'Use initials or a clinic number rather than the full name. Patients never see this label.');
  var fCode = isNew ? field('Key (optional)', '', general ? 'e.g. FRIENDS26' : 'leave blank for an automatic key', 'Leave blank and a random 8-character key is made. A custom key needs 4 to 16 letters or digits.') : null;
  var fMin = field('Daily minutes target', plan.minutes || 15, '15');
  var nums = {}, dateInp = null, pv = null;
  function num(id, label, max, val){ var inp = h('input', {type:'text', inputmode:'numeric', autocomplete:'off'}); inp.value = val == null ? '' : val; nums[id] = inp; inp.addEventListener('input', recalc);
    return h('div', {class:'rowin', style:{gridTemplateColumns:'1fr 96px', alignItems:'center'}}, [h('label', {text:label+(max ? ' (0–'+max+')' : '')}), inp]); }
  if (!general){
    p.appendChild(h('h3', {text:'Test results'}));
    dateInp = field('Date of testing', sc.date || isoDay(Date.now()), 'YYYY-MM-DD');
    p.appendChild(h('h3', {text:'MoCA subscores'}));
    var mt = h('p', {class:'muted', text:'Total: –'}); p.appendChild(mt);
    MOCA_MAP.forEach(function(m){ p.appendChild(num('m_'+m[0], m[1], m[2], sc.moca && sc.moca[m[0]])); });
    p.appendChild(h('h3', {text:'CANTAB percentiles (1–99, higher is better)'}));
    var st = h('p', {class:'muted', text:'Upload the CANTAB PDF report to fill these in, or type them.'}), file = h('input', {type:'file', accept:'application/pdf,.pdf', 'aria-label':'CANTAB report PDF'});
    p.append(h('div', null, [file]), st);
    CAN_MAP.forEach(function(c){ p.appendChild(num('c_'+c[0], c[1], 0, sc.cantab && sc.cantab[c[0]])); });
    file.addEventListener('change', async function(){
      var f = file.files[0]; if (!f) return;
      if (!window.pdfjsLib){ st.textContent = 'The PDF reader could not load. Please type the percentiles.'; return; }
      st.textContent = 'Reading the report…';
      try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        var pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise, pages = [];
        for (var i=1;i<=pdf.numPages;i++){ var c = await (await pdf.getPage(i)).getTextContent(); pages.push(c.items.map(function(t){ return {str:t.str, x:t.transform[4], y:t.transform[5]}; })); }
        var parsed = E.parseCantab(E.itemsToText(pages));
        Object.keys(parsed.measures).forEach(function(k){ if (nums['c_'+k]) nums['c_'+k].value = parsed.measures[k].pct; });
        st.textContent = parsed.found ? 'Read '+parsed.found+' of 5 measures from the report. Please check them.' : 'No measures found. Please type the percentiles.';
        recalc();
      } catch(err){ st.textContent = 'Could not read this PDF here. Please type the percentiles.'; }
    });
  }
  /* priorities */
  var pr = h('div', {class:'panel'}); app.appendChild(pr);
  var weights = Object.assign({}, plan.weights), cur = {def:{}, src:{}};
  function val(id){ var x = nums[id] ? nums[id].value.trim() : ''; return x === '' || isNaN(+x) ? null : +x; }
  function inputs(){ var moca = {}, cantab = {}; MOCA_MAP.forEach(function(m){ moca[m[0]] = val('m_'+m[0]); }); CAN_MAP.forEach(function(c){ cantab[c[0]] = val('c_'+c[0]); }); return {moca:moca, cantab:cantab}; }
  function recalc(){
    if (!general){ var x = inputs(); cur = domainDeficits(x.moca, x.cantab);
      var tot = MOCA_MAP.reduce(function(s,m){ return x.moca[m[0]] == null ? s : s + x.moca[m[0]]; }, 0), any = MOCA_MAP.some(function(m){ return x.moca[m[0]] != null; });
      if (mt) mt.textContent = any ? 'Total from subscores: '+tot+'/30 (add 1 point if 12 years of education or less)' : 'Total: –';
      if (!manual) weights = autoWeights(cur.def); }
    else { cur = {def:{}, src:{}}; if (!manual) GAME_KEYS.forEach(function(k){ weights[k] = 1; }); }
    drawPr();
  }
  function drawPr(){
    clear(pr);
    pr.appendChild(h('h3', {text:'Domain profile'}));
    if (general) pr.appendChild(h('p', {class:'muted', text:'No test results: every game gets the same priority, and the task of the day rotates evenly.'}));
    else {
      var dl = h('div', {class:'dombars'});
      DOMS.forEach(function(d){ var v = cur.def[d[0]]; dl.appendChild(h('div', {class:'dombar'}, [h('span', {text:d[1]}), h('i', null, [h('em', {style:{width: v == null ? '0' : Math.round(v*100)+'%', background: v >= .6 ? 'var(--bad)' : v >= .35 ? 'var(--warn, #c98a1b)' : 'var(--good)'}})]), h('small', {class:'muted', text: v == null ? 'no data' : v >= .6 ? 'marked' : v >= .35 ? 'mild' : 'fine'})])); });
      pr.appendChild(dl);
    }
    pr.appendChild(h('h3', {text:'Game priority (how often each game is the task of the day)'}));
    var tot = GAME_KEYS.reduce(function(s,k){ return s + (weights[k] == null ? 1 : weights[k]); }, 0) || 1;
    var list = h('div', {class:'prlist'});
    GAME_KEYS.forEach(function(k){
      var w = weights[k] == null ? 1 : weights[k];
      var minus = h('button', {type:'button', class:'ghost small', 'aria-label':'Less '+GAMES[k].name, text:'−'}), plus = h('button', {type:'button', class:'ghost small', 'aria-label':'More '+GAMES[k].name, text:'+'});
      minus.addEventListener('click', function(){ manual = true; weights[k] = Math.max(0, w - .5); drawPr(); });
      plus.addEventListener('click', function(){ manual = true; weights[k] = Math.min(5, w + .5); drawPr(); });
      list.appendChild(setVars(h('div', {class:'prrow'}, [h('span', {class:'pri', html:ICON[k]}), h('div', null, [h('b', {text:GAMES[k].name}), h('small', {class:'muted', text: GAMES[k].trains})]),
        h('i', {class:'prbar'}, [h('em', {style:{width: Math.round(w/5*100)+'%'}})]), h('span', {class:'prpct', text: w === 0 ? 'off' : Math.round(w/tot*100)+'% of days'}), minus, plus]), k));
    });
    pr.appendChild(list);
    if (manual){ var au = h('button', {type:'button', class:'ghost small', text:'Back to automatic priorities'}); au.addEventListener('click', function(){ manual = false; recalc(); }); pr.appendChild(au); }
    pr.appendChild(h('p', {class:'muted', text:'All games stay open for free play. Priorities only decide the task of the day. Rule of thumb: a weaker domain makes its game up to 5 times more likely. Daily Anchors is always available outside this rotation.'}));
  }
  /* save */
  var sv = h('div', {class:'panel'}); app.appendChild(sv);
  var msg = h('p', {class:'err', 'aria-live':'polite'}), save = h('button', {type:'button', text: isNew ? 'Create key' : 'Save changes'});
  sv.append(save, msg);
  save.addEventListener('click', async function(){
    msg.textContent = ''; var label = fLabel.value.trim(), code = fCode ? normCode(fCode.value) : plan.code, mins = +fMin.value || 15;
    if (!label){ msg.textContent = 'Please add a label.'; return; }
    if (fCode && fCode.value.trim() && !/^[A-Z0-9]{4,16}$/.test(code)){ msg.textContent = 'A custom key needs 4 to 16 letters or digits.'; return; }
    var x = general ? {moca:{}, cantab:{}} : inputs();
    if (!general && !MOCA_MAP.some(function(m){ return x.moca[m[0]] != null; }) && !CAN_MAP.some(function(c){ return x.cantab[c[0]] != null; }) && !manual){ msg.textContent = 'Enter at least one MoCA or CANTAB result, or use a general key.'; return; }
    var body = {type:'plan', isNew:isNew, plan:{code:code || '', label:label, type: general ? 'general' : 'patient', minutes:mins, active: plan.active !== false,
      weights:weights, focus: general ? [] : focusOf(cur.def), scores: general ? {} : {date: dateInp ? dateInp.value.trim() : '', moca:x.moca, cantab:x.cantab, deficits:cur.def, manual:manual}}};
    save.disabled = true; save.textContent = 'Saving…';
    try { var j = await postOrg(body); showKeyDone(j.code, label, isNew); }
    catch(e){ save.disabled = false; save.textContent = isNew ? 'Create key' : 'Save changes'; msg.textContent = e.message === 'taken' ? 'That key is already in use. Choose another.' : e.message === 'key' ? 'Your organiser key was not accepted.' : 'Could not save. Check your connection and try again.'; }
  });
  if (!isNew){
    var off = h('button', {type:'button', class:'ghost', text: plan.active === false ? 'Turn this key back on' : 'Turn this key off'});
    off.addEventListener('click', async function(){ off.disabled = true; var pl2 = Object.assign({}, plan, {active: plan.active === false}); try { await postOrg({type:'plan', isNew:false, plan:pl2}); showKeys(); } catch(e){ off.disabled = false; msg.textContent = 'Could not change the key.'; } });
    sv.append(h('div', {class:'btnrow', style:{justifyContent:'flex-start'}}, [copyBtn(shareText(plan.code), 'Copy message for patient'), off]));
  }
  recalc(); footer();
}
function showKeyDone(code, label, isNew){
  page('admin');
  var p = h('div', {class:'panel res keydone'}); app.appendChild(p);
  p.append(h('span', {class:'eyebrow', text: isNew ? 'Key created' : 'Saved'}), h('h2', {text:label}), h('p', {class:'bigcode', text:fmtCode(code)}),
    h('p', {text:'Give this key to the patient. They type it once when they start, or open the link below.'}),
    h('pre', {class:'share', text:shareText(code)}),
    h('div', {class:'btnrow', style:{justifyContent:'flex-start'}}, [copyBtn(fmtCode(code), 'Copy key'), copyBtn(shareText(code), 'Copy message (WhatsApp/SMS)')]));
  var b = h('button', {type:'button', class:'ghost', text:'← All keys'}); b.addEventListener('click', showKeys); p.appendChild(b);
  if (isNew) burst(p.querySelector('.bigcode'));
  footer();
}

/* ===== start-up ===== */
var URL_KEY = (function(){ try { var m = /[?&]key=([A-Za-z0-9-]{4,20})/.exec(location.search); return m ? normCode(m[1]) : ''; } catch(e){ return ''; } })();
window.addEventListener('hashchange', route);
startTranslator(app);
initSync();
refreshPlan();
if (URL_KEY && loadProfile() && (!loadPlan() || loadPlan().code !== URL_KEY)) fetchPlan(URL_KEY).then(function(np){ savePlan(np); var pr = loadProfile(); pr.code = np.code; lsSet(KEYS.prof, pr); syncPlayer(); if (currentView === 'hub') showHub(); }).catch(function(){});
window.__bts = {taskFor:taskFor, todayTask:todayTask, loadPlan:loadPlan, loadMins:loadMins, upsertRecord:upsertRecord, newSid:newSid, isoDay:isoDay, GAMES:GAMES, syncPlayer:syncPlayer, showHub:showHub, showAdmin:showAdmin, showKeys:showKeys, setView:function(v){ currentView = v; }};
route();


})();
